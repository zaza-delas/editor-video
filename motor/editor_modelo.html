<html lang="pt-BR">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Montserrat:wght@600;700;900&family=Poppins:wght@600;700;900&family=Oswald:wght@600;700&family=Anton&family=Bebas+Neue&family=Bangers&family=Luckiest+Guy&family=Archivo+Black&family=Lilita+One&family=Permanent+Marker&family=Noto+Color+Emoji&display=swap">
<style>
:root {
  color-scheme: dark;
  /* cor: referência do Zaza = CapCut: grafite quase preto, painéis em camadas, ciano na seleção e na ação */
  --fundo: #0f0f12;
  --painel: #1a1a1f;
  --painel2: #24242b;
  --linha: #2e2e36;
  --texto: #e8e8ee;
  --fraco: #8a8a96;
  --destaque: #22d3ee;
  /* cores das faixas como no CapCut: texto laranja, áudio verde, adesivo roxo */
  --c-texto: #8c5a1e; --c-texto-t: #ffd59a;
  --c-audio: #17594a; --c-audio-t: #8be8cc;
  --c-balao: #4f3f86;
  /* fonte: Barlow Semi Condensed cabe muito rótulo de timeline em pouco espaço;
     Montserrat só dentro do quadro, que é a fonte do vídeo final */
  --ui: "Barlow Semi Condensed", system-ui, sans-serif;
  /* layout: CapCut. Largo: sons | player | propriedades em cima, timeline na largura toda embaixo.
     Médio: player | propriedades. Celular: player, timeline, propriedades, sons. */
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--ui); font-size: 15px; }
body { padding: 8px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--painel2); border: 1px solid var(--linha); border-radius: 6px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
button:hover { border-color: var(--fraco); }
button:disabled { opacity: .35; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--destaque); outline-offset: 1px; }
button.principal { background: var(--destaque); color: #06272d; border-color: var(--destaque); font-weight: 600; }
button.icone { width: 36px; padding: 0; display: inline-grid; place-items: center; background: transparent; border-color: transparent; }
button.icone:hover:not(:disabled) { background: var(--painel2); }
button.icone svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
input, select, textarea { background: var(--fundo); border: 1px solid var(--linha); border-radius: 6px; padding: 6px 8px; min-height: 34px; width: 100%; }
textarea { resize: vertical; min-height: 52px; }
input[type=range] { accent-color: var(--destaque); padding: 0; border: 0; background: transparent; min-height: 28px; }
label { display: grid; gap: 4px; color: var(--fraco); font-size: 13px; min-width: 0; }

.app {
  display: grid; gap: 8px;
  grid-template-columns: 240px minmax(0, 1fr) 320px;
  grid-template-areas: "topo topo topo" "sons player props" "tl tl tl";
}
@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr) minmax(260px, 1fr); grid-template-areas: "topo topo" "player props" "player sons" "tl tl"; }
}
@media (max-width: 640px) {
  .app .tela { max-width: max(180px, calc(48vh * 9 / 16)); }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "topo" "player" "tl" "props" "sons"; }
}
.caixa { background: var(--painel); border-radius: 8px; min-width: 0; }

.topo { grid-area: topo; display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
.topo h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sons { grid-area: sons; padding: 12px; display: grid; gap: 12px; align-content: start; }
.abas { display: flex; gap: 4px; }
.abas button { flex: 1; background: transparent; border-color: transparent; color: var(--fraco); }
.abas button.on { background: var(--painel2); color: var(--texto); }
.lista { display: grid; gap: 4px; }
.item-som { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 8px; background: var(--painel2); border-radius: 6px; padding: 4px 8px 4px 4px; }
.item-som span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-som small { color: var(--fraco); font-variant-numeric: tabular-nums; }
.item-som .add { min-height: 30px; padding: 2px 10px; }

.player { grid-area: player; padding: 8px; display: grid; gap: 8px; justify-items: center; align-content: start; }
.tela { position: relative; width: 100%; max-width: max(200px, calc(56vh * 9 / 16)); aspect-ratio: 9 / 16; background: #000; overflow: hidden; }
.tela canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tela .camada { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; pointer-events: none; }
.transporte { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; max-width: 520px; }
.tc { font-variant-numeric: tabular-nums; color: var(--fraco); font-size: 14px; }
.tc b { color: var(--destaque); font-weight: 500; }

.props { grid-area: props; padding: 12px; display: grid; gap: 12px; align-content: start; }
.props h2 { margin: 0; font-size: 16px; font-weight: 600; }
.vazio { color: var(--fraco); margin: 0; }
.barra { display: grid; grid-template-columns: 74px minmax(0, 1fr) 52px; align-items: center; gap: 8px; font-size: 14px; }
.barra span { color: var(--fraco); }
.barra output { text-align: right; font-variant-numeric: tabular-nums; }
.grade2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 8px; }
.alternar { display: flex; align-items: center; gap: 8px; color: var(--texto); font-size: 14px; }
.alternar input { width: auto; min-height: 0; accent-color: var(--destaque); }

.tl { grid-area: tl; padding: 4px 0 8px; user-select: none; -webkit-user-select: none; }
.ferramentas { display: flex; align-items: center; gap: 2px; padding: 0 8px 4px; border-bottom: 1px solid var(--linha); }
.ferramentas .sep { width: 1px; height: 20px; background: var(--linha); margin: 0 6px; }
.ferramentas .zoom { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--fraco); }
.ferramentas .zoom input { width: 120px; }
.tl-corpo { display: grid; grid-template-columns: 64px minmax(0, 1fr); }
.cabecas { border-right: 1px solid var(--linha); }
.cabecas div { display: flex; align-items: center; padding-left: 8px; font-size: 12px; color: var(--fraco); border-bottom: 1px solid transparent; }
.rolagem { overflow-x: auto; overflow-y: hidden; position: relative; touch-action: pan-x; }
.trilho { position: relative; }
.regua { position: relative; height: 26px; cursor: ew-resize; color: var(--fraco); font-size: 11px; font-variant-numeric: tabular-nums; touch-action: none; }
.regua span { position: absolute; top: 2px; transform: translateX(3px); }
.regua i { position: absolute; bottom: 0; width: 1px; height: 5px; background: var(--linha); }
.regua i.g { height: 10px; background: var(--fraco); }
.pista { position: relative; margin-bottom: 4px; }
.h-video { height: 66px; } .h-leg { height: 30px; } .h-sfx { height: 34px; } .h-balao { height: 26px; } .h-sobre { height: 40px; }
.pista.alvo { outline: 1px dashed #ffffff55; outline-offset: -1px; border-radius: 5px; }
.pista.vazia { background: repeating-linear-gradient(90deg, #ffffff08 0 12px, transparent 12px 24px); border-radius: 5px; }
.b-sobre { background: #3a6fd8; }
.bloco { position: absolute; top: 0; bottom: 0; border-radius: 5px; overflow: hidden; cursor: grab; touch-action: none; font-size: 12px; border: 2px solid transparent; }
.bloco.sel { border-color: #fff; z-index: 2; }
.bloco .rot { position: absolute; left: 4px; top: 2px; right: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.b-video { background: #203a44; }
.b-video .minis { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; overflow: hidden; pointer-events: none; }
.b-video .minis div { flex: 0 0 auto; height: 44px; background-repeat: no-repeat; }
.b-video .rot { background: rgba(0, 0, 0, .55); left: 2px; right: auto; max-width: calc(100% - 4px); padding: 0 4px; border-radius: 3px; }
.b-video svg.onda { position: absolute; left: 0; bottom: 0; height: 18px; width: 100%; pointer-events: none; }
.b-video svg.onda path { stroke: #7fc6d6; stroke-width: 1; }
.b-leg { background: var(--c-texto); color: var(--c-texto-t); }
.b-leg .rot { top: 5px; }
.b-sfx { background: var(--c-audio); color: var(--c-audio-t); }
.b-sfx svg.onda { position: absolute; inset: 14px 0 0 0; width: 100%; height: 18px; pointer-events: none; }
.b-sfx svg.onda path { stroke: var(--c-audio-t); stroke-width: 1; opacity: .7; }
.b-balao { background: var(--c-balao); }
.b-balao .rot { top: 3px; }
.mudo { opacity: .55; }
.bloco.off { opacity: .35; background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(0,0,0,.35) 6px 9px); }
button.icone.on { color: var(--destaque); background: var(--painel2); }
.alca { position: absolute; top: 0; bottom: 0; width: 12px; cursor: ew-resize; z-index: 3; }
.alca.e { left: -2px; } .alca.d { right: -2px; }
.bloco.sel .alca::after { content: ""; position: absolute; top: 25%; bottom: 25%; left: 4px; width: 3px; border-radius: 2px; background: #fff; }
.cabeca { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; z-index: 5; pointer-events: none; }
.cabeca::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top: 8px solid #fff; }
.guia { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--destaque); z-index: 4; pointer-events: none; display: none; }
.aviso { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--texto); color: var(--fundo); padding: 10px 16px; border-radius: 8px; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
.aviso.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .aviso { transition: none; } }

/* ===== quadro do vídeo: mesmo CSS do render ===== */

</style>

<div class="app">
  <div class="topo">
    <h1 id="titulo">Editor</h1>
    <button id="bt-baixar" class="principal">Baixar projeto</button>
  </div>

  <div class="caixa sons" id="sons"></div>

  <div class="caixa player">
    <div class="tela" id="tela">
      <canvas id="cv" width="540" height="960"></canvas>
      <div class="camada"><div class="quadro" id="quadro"></div></div>
    </div>
    <div class="transporte">
      <span class="tc" id="tc"></span>
      <button id="bt-play" class="icone" title="Tocar (espaço)" style="width:44px;height:44px"><svg><use href="#i-play"/></svg></button>

      </div>

      <div class="cabecas" id="cabecas"></div>

<script>
const DADOS = /*__DADOS__*/null;
const FPS = (DADOS.projeto.formato && DADOS.projeto.formato.fps) || 30;
let P = JSON.parse(JSON.stringify(DADOS.projeto));
P.legendas = P.legendas || []; P.sfx = P.sfx || []; P.estilo = P.estilo || {}; P.sobre = P.sobre || [];
const M = DADOS.midias;
let T = 0, tocando = false, relogio0 = 0, T0 = 0, Tant = 0;
let sel = null;          // {tipo: 'trecho'|'legenda'|'sfx'|'balao', i}  (o principal)
let multi = [];          // índices do mesmo tipo quando tem mais de um selecionado
let modoVarios = false;  // botão "selecionar vários" (pro celular)
const LISTA = { trecho: () => P.trechos, legenda: () => P.legendas, sfx: () => P.sfx, sobre: () => P.sobre };
function selecionados() { if (!sel) return []; if (multi.length > 1) return multi.map((i) => ({ tipo: sel.tipo, i })); return [sel]; }
function itemDe(s) { return s.tipo === 'balao' ? P.balao : LISTA[s.tipo]()[s.i]; }
let pxs = 90;
let abaSons = 'sons';

const $ = (id) => document.getElementById(id);
const q = (s) => Math.round(s * FPS) / FPS;
const r3 = (s) => Math.round(s * 1000) / 1000;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const pad = (n) => String(n).padStart(2, '0');
function tc(s) { const f = Math.round(s * FPS); const seg = Math.floor(f / FPS); return `${pad(Math.floor(seg / 60))}:${pad(seg % 60)}:${pad(f % FPS)}`; }
function curto(s) { return (Math.round(s * 10) / 10).toFixed(1).replace('.', ',') + 's'; }
function aviso(txt) { const a = $('aviso'); a.textContent = txt; a.classList.add('on'); clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove('on'), 1600); }

// ---------- desfazer / refazer ----------
const pilhaD = [], pilhaR = [];
let pendente = null; // estado antes de uma mudança contínua (barra, texto)
function confirmar(antes) {
  if (antes == null || antes === JSON.stringify(P)) return;
  pilhaD.push(antes); if (pilhaD.length > 200) pilhaD.shift(); pilhaR.length = 0; botoesHist();
}
function mudar(fn) { const antes = JSON.stringify(P); fn(); confirmar(antes); }
function abrirPendente() { if (pendente == null) pendente = JSON.stringify(P); }
function fecharPendente() { confirmar(pendente); pendente = null; }
function desfazer() { fecharPendente(); if (!pilhaD.length) return aviso('Nada pra desfazer'); pilhaR.push(JSON.stringify(P)); P = JSON.parse(pilhaD.pop()); validarSel(); tudo(); }
function refazer() { fecharPendente(); if (!pilhaR.length) return aviso('Nada pra refazer'); pilhaD.push(JSON.stringify(P)); P = JSON.parse(pilhaR.pop()); validarSel(); tudo(); }
function botoesHist() { $('bt-desfazer').disabled = !pilhaD.length; $('bt-refazer').disabled = !pilhaR.length; }
function validarSel() {
  multi = [];
  if (!sel) return;
  const lista = { trecho: P.trechos, legenda: P.legendas, sfx: P.sfx, sobre: P.sobre }[sel.tipo];
  if (sel.tipo === 'balao' ? !P.balao : !lista[sel.i]) sel = null;
}

// ---------- linha do tempo ----------
function durTrecho(t) { return (M[t.midia] || {}).tipo === 'imagem' ? (t.duracao || 1) : (t.ate - t.de); }
function estrutura(trechos) { let ini = 0; return trechos.map((t) => { const d = durTrecho(t), o = { t, ini, dur: d, de: t.de || 0 }; ini += d; return o; }); }
function linha() { const tr = estrutura(P.trechos); const total = tr.length ? tr[tr.length - 1].ini + tr[tr.length - 1].dur : 0; return { tr, total }; }
function trechoEm(tempo, tr, fim) {
  for (let k = 0; k < tr.length; k++) { const x = tr[k]; if (fim ? tempo <= x.ini + x.dur + 1e-6 : tempo < x.ini + x.dur - 1e-6) return k; }
  return tr.length - 1;
}
function durSfx(s) { const m = M[s.midia] || {}; return Math.max(0.05, Math.min(s.duracao || 99, Math.min(m.duracao || 1, 12) - (s.inicio || 0))); }
function durSobre(o) { return (M[o.midia] || {}).tipo === 'imagem' ? (o.duracao || 2) : (o.ate - (o.de || 0)); }

// ---------- camadas (pistas): legenda, SFX e clipe por cima podem ficar um sobre o outro ----------
const COM_PISTA = ['legenda', 'sfx', 'sobre'];
function iv(tipo, o) { return tipo === 'legenda' ? [o.de, o.ate] : tipo === 'sfx' ? [o.em, o.em + durSfx(o)] : [o.em, o.em + durSobre(o)]; }
function nPistas(tipo) { const l = LISTA[tipo](); return l.length ? Math.max(...l.map((o) => o.pista || 0)) + 2 : 1; }
function livre(tipo, o, k) { const [a, b] = iv(tipo, o); return !LISTA[tipo]().some((x) => x !== o && (x.pista || 0) === k && Math.min(b, iv(tipo, x)[1]) - Math.max(a, iv(tipo, x)[0]) > 0.001); }
function acomodar(tipo, o) { let k = o.pista || 0; while (!livre(tipo, o, k)) k++; if (k) o.pista = k; else delete o.pista; }
function compactar(tipo) { // tira camada vazia do meio (ex.: moveu o único item da camada 1 pra 3)
  const usadas = [...new Set(LISTA[tipo]().map((o) => o.pista || 0))].sort((x, y) => x - y), novo = {};
  usadas.forEach((k, j) => { novo[k] = j; });
  LISTA[tipo]().forEach((o) => { const k = novo[o.pista || 0]; if (k) o.pista = k; else delete o.pista; });
}
function vizinhos(tipo, o, lista) { // começo e fim livres em volta de o, na mesma pista
  const k = o.pista || 0, [a] = iv(tipo, o); let ant = 0, prox = Infinity;
  for (const x of lista) { if (x === o || (x.pista || 0) !== k) continue; const [xa, xb] = iv(tipo, x); if (xb <= a + 1e-6) ant = Math.max(ant, xb); else if (xa >= a - 1e-6) prox = Math.min(prox, xa); }
  return [ant, prox];
}

/* Quando um trecho muda (aparar, apagar), legendas e SFX andam junto com o conteúdo:
   cada tempo vira "segundo X do original" e volta pro novo tempo final. */
function remapear(velho, novo, mapaIdx) {
  const tv = estrutura(velho), tn = estrutura(novo);
  const totalN = tn.length ? tn[tn.length - 1].ini + tn[tn.length - 1].dur : 0;
  const map = (t, fim) => {
    const k = trechoEm(t, tv, fim), x = tv[k]; if (!x) return { t, fora: false };
    const src = x.de + (t - x.ini), nk = mapaIdx(k);

    const y = tn[nk]; const c = Math.min(Math.max(src, y.de), y.de + y.dur);

function intervalo(s) {

  if (s.tipo === 'sfx') { const x = P.sfx[s.i]; return x && [x.em, x.em + durSfx(x)]; }

function aplicarArraste(dt) {

function dividir() {

    const g = P.legendas[sel.i]; if (!(g.de + 0.05 < tq && tq < g.ate - 0.05)) return aviso('Ponha a agulha dentro da legenda');

  }
  if (sel && sel.tipo === 'balao') return aviso('O balão não divide');
  const L = linha(), k = trechoEm(T, L.tr, false), x = L.tr[k];
  if (!x || (M[x.t.midia] || {}).tipo === 'imagem') return aviso('Não dá pra dividir aqui');
  if (T - x.ini < 0.05 || x.ini + x.dur - T < 0.05) return aviso('Ponha a agulha mais pro meio do trecho');
  mudar(() => { const t = P.trechos[k], b = clone(t), c = r3(x.de + (T - x.ini)); t.ate = c; b.de = c; P.trechos.splice(k + 1, 0, b); sel = { tipo: 'trecho', i: k + 1 }; tudo(); });

}
function apagar() {

    if (tipo === 'trecho' && idx.length >= P.trechos.length) return aviso('O vídeo precisa de pelo menos um trecho');
    return mudar(() => {
      for (const k of idx) {
        if (tipo === 'trecho') { const velho = clone(P.trechos); P.trechos.splice(k, 1); remapear(velho, P.trechos, (j) => (j < k ? j : j === k ? -1 : j - 1)); }
        else LISTA[tipo]().splice(k, 1);
      }
      aviso(`${idx.length} apagados`); sel = null; multi = []; textoAtual = null; tudo();
    });
  }
  if (sel.tipo === 'trecho') {
    if (P.trechos.length < 2) return aviso('O vídeo precisa de pelo menos um trecho');
    const k = sel.i;
    return mudar(() => { const velho = clone(P.trechos); P.trechos.splice(k, 1); remapear(velho, P.trechos, (j) => (j < k ? j : j === k ? -1 : j - 1)); sel = null; tudo(); });
  }
  mudar(() => {
    if (sel.tipo === 'legenda') P.legendas.splice(sel.i, 1);

}
$('sons').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.aba) { abaSons = b.dataset.aba; return sons(); }
  if (b.dataset.ouvir) { garantirAudio(); return tocarSom(b.dataset.ouvir, 1); }
  if (b.dataset.add) return addSfx(b.dataset.add);

  if (b.dataset.acao === 'add-leg') return addLegenda();
  if (b.dataset.acao === 'add-balao') return mudar(() => { P.balao = { texto: 'Texto do balão', de: 0, ate: Math.min(3.5, linha().total) }; sel = { tipo: 'balao', i: 0 }; textoAtual = null; tudo(); });

      <label>Encaixe<select data-c="encaixe"><option value="">Cobrir a tela</option><option value="borrado" ${t.encaixe === 'borrado' ? 'selected' : ''}>Inteiro, fundo borrado</option><option value="conter" ${t.encaixe === 'conter' ? 'selected' : ''}>Inteiro, faixas pretas</option></select></label>
      ${m.tipo === 'imagem' ? `<label>Duração (s)<input type="number" step="0.05" data-c="duracao" value="${n3(t.duracao || 1)}"></label>` :
        `<div class="grade2"><label>Início no original (s)<input type="number" step="0.01" data-c="de" value="${n3(t.de)}"></label><label>Fim no original (s)<input type="number" step="0.01" data-c="ate" value="${n3(t.ate)}"></label></div>`}`;
  } else if (sel.tipo === 'sfx') {
    const s = P.sfx[sel.i], op = Object.entries(M).filter(([, m]) => m.tipo === 'audio').map(([n]) => `<option ${n === s.midia ? 'selected' : ''}>${esc(n)}</option>`).join('');
    el.innerHTML = `<h2>Efeito sonoro</h2>${chkOff(s, 'Desativado')}
      ${barra('Volume', 'volume', Math.round((s.volume ?? 1) * 100), 0, 200, 1, pct)}
      <label>Som<select data-c="midia">${op}</select></label>
      <div class="grade2"><label>Toca em (s)<input type="number" step="0.01" data-c="em" value="${n3(s.em)}"></label>
      <div style="display:flex;align-items:end"><button data-ouvir-sel style="width:100%">Ouvir</button></div></div>`;
  } else if (sel.tipo === 'sobre') {
    const o = P.sobre[sel.i], m = M[o.midia] || {};
    el.innerHTML = `<h2>Por cima: ${esc(o.midia)}</h2>${chkOff(o, 'Desativado')}
      ${barra('Tamanho', 'largura', Math.round(o.largura || 1080), 100, 1080, 10, (v) => v)}
      ${barra('Esquerda', 'x', Math.round(o.x || 0), -540, 1080, 5, (v) => v)}
      ${barra('Altura', 'ytopo', Math.round(o.y ?? -1), -1, 1900, 5, (v) => (v < 0 ? 'centro' : v))}
      ${m.tipo === 'video' ? barra('Volume', 'volume', Math.round((o.volume ?? 1) * 100), 0, 200, 1, pct) + `<label class="alternar"><input type="checkbox" data-c="mudo" ${o.mudo ? 'checked' : ''}> Sem som</label>` : ''}
      <div class="grade2"><label>Entra em (s)<input type="number" step="0.01" data-c="em" value="${n3(o.em)}"></label>
      ${m.tipo === 'imagem' ? `<label>Duração (s)<input type="number" step="0.05" data-c="duracao" value="${n3(o.duracao || 2)}"></label>` : `<label>Começa no original (s)<input type="number" step="0.01" data-c="de" value="${n3(o.de || 0)}"></label>`}</div>`;
  } else if (sel.tipo === 'balao') {
    const b = P.balao;
    el.innerHTML = `<h2>Balão do topo</h2>${chkOff(b, 'Desativado')}<label>Texto<textarea data-c="texto">${esc(b.texto)}</textarea></label>
      <div class="grade2"><label>Começa (s)<input type="number" step="0.01" data-c="de" value="${n3(b.de || 0)}"></label><label>Termina (s)<input type="number" step="0.01" data-c="ate" value="${n3(b.ate ?? 3.5)}"></label></div>`;
  }
}
function alvo() { return sel && (sel.tipo === 'legenda' ? P.legendas[sel.i] : sel.tipo === 'sfx' ? P.sfx[sel.i] : sel.tipo === 'sobre' ? P.sobre[sel.i] : sel.tipo === 'balao' ? P.balao : sel.tipo === 'trecho' ? P.trechos[sel.i] : null); }
function aplicar(c, v) {
  if (c.startsWith('g:')) { const [, g, k] = c.split(':'); P.estilo[g] = P.estilo[g] || {}; P.estilo[g][k] = v; textoAtual = null; return; }
  if (sel && multi.length > 1) {
    const lista = LISTA[sel.tipo]();
    for (const i of multi) { const o = lista[i]; if (!o) continue;
      if (c === 'volume') o.volume = v / 100; else if (v) o[c] = true; else delete o[c]; }
    textoAtual = null; return;
  }
  const o = alvo(); if (!o) return;
  if (sel.tipo === 'trecho' && (c === 'de' || c === 'ate' || c === 'duracao')) {
    const velho = clone(P.trechos), m = M[o.midia] || {};
    if (c === 'de') o.de = r3(Math.min(Math.max(0, v), o.ate - 0.1));
    else if (c === 'ate') o.ate = r3(Math.max(Math.min(v, m.duracao || 1e9), o.de + 0.1));
    else o.duracao = r3(Math.max(0.1, v));
    return remapear(velho, P.trechos, (k) => k);
  }
  if (sel.tipo === 'legenda' && c === 'y') { o.estilo = { ...(o.estilo || {}), y: v }; textoAtual = null; return; }
  if (sel.tipo === 'sobre' && c === 'ytopo') { if (v < 0) delete o.y; else o.y = v; return; }
  if (sel.tipo === 'sobre' && c === 'de') { const d = durSobre(o); o.de = r3(Math.max(0, v)); o.ate = r3(o.de + d); return; }
  if (c === 'volume' || c === 'zoom') { v = v / 100; if (c === 'zoom' && v === 1) { delete o.zoom; return; } }
  if ((c === 'mudo' || c === 'desativado') && !v) { delete o[c]; textoAtual = null; return; }
  if (c === 'encaixe' && !v) { delete o.encaixe; return; }
  o[c] = v;
  if (sel.tipo === 'legenda') { if (o.ate <= o.de) o.ate = r3(o.de + 0.1); P.legendas.sort((a, b) => a.de - b.de); sel.i = P.legendas.indexOf(o); }
  if (sel.tipo === 'sfx' && c === 'em') { P.sfx.sort((a, b) => a.em - b.em); sel.i = P.sfx.indexOf(o); }
  textoAtual = null;
}
$('props').addEventListener('input', (e) => {
  const c = e.target.dataset.c; if (!c) return;
  const tp = e.target.type;
  if (e.target.tagName === 'TEXTAREA' || tp === 'range' || tp === 'color') {
    abrirPendente();
    aplicar(c, tp === 'range' ? +e.target.value : e.target.value);
    if (tp === 'range') { const o = e.target.parentElement.querySelector('output'); if (o) o.textContent = c.includes('tam') ? e.target.value + 'px' : (c === 'volume' || c === 'zoom') ? e.target.value + '%' : (c === 'ytopo' && +e.target.value < 0) ? 'centro' : e.target.value; }
    desenharTimeline();
  }
});
$('props').addEventListener('change', (e) => {
  const c = e.target.dataset.c; if (!c) return;
  const tp = e.target.type;
  if (e.target.tagName === 'TEXTAREA' || tp === 'range' || tp === 'color') { fecharPendente(); return; }
  mudar(() => aplicar(c, tp === 'checkbox' ? e.target.checked : tp === 'number' ? +e.target.value : e.target.value));
  e.target.blur(); tudo();
});
$('props').addEventListener('focusout', () => { if (pendente != null) fecharPendente(); });
$('props').addEventListener('click', (e) => {
  if (e.target.closest('[data-todos]')) return selecionarTodos(sel.tipo);
  if (e.target.closest('[data-limpar]')) { multi = []; return tudo(); } if (e.target.closest('[data-ouvir-sel]')) { garantirAudio(); const s = P.sfx[sel.i]; tocarSom(s.midia, s.volume ?? 1, s.inicio || 0, s.duracao ? (s.inicio || 0) + s.duracao : null); } });

// ---------- botões e teclado ----------
$('bt-play').onclick = () => (tocando ? parar() : tocar());
$('bt-desfazer').onclick = desfazer;
$('bt-refazer').onclick = refazer;
$('bt-split').onclick = dividir;
$('bt-apagar').onclick = apagar;
$('bt-olho').onclick = alternarDesativado;
$('bt-varios').onclick = () => { modoVarios = !modoVarios; $('bt-varios').classList.toggle('on', modoVarios); aviso(modoVarios ? 'Toque nos blocos pra juntar na seleção' : 'Seleção simples'); };
function zoom(v) { const r = $('rolagem'), centro = (r.scrollLeft + r.clientWidth / 2) / pxs; pxs = Math.min(300, Math.max(20, v)); $('zoom').value = pxs; desenharTimeline(); r.scrollLeft = centro * pxs - r.clientWidth / 2; }
$('zoom').oninput = (e) => zoom(+e.target.value);
$('bt-zmenos').onclick = () => zoom(pxs / 1.3);
$('bt-zmais').onclick = () => zoom(pxs * 1.3);
$('rolagem').addEventListener('wheel', (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoom(pxs * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); } }, { passive: false });
$('bt-baixar').onclick = () => {
  fecharPendente();
  const txt = JSON.stringify(P, null, 2), nome = (P.nome || 'projeto') + '.json';
  if (window.kingbot && window.kingbot.download) window.kingbot.download(nome, txt, 'application/json');
  else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = nome; a.click(); }
  ultimoBaixado = JSON.stringify(P);
  aviso('Projeto baixado: manda o arquivo .json no chat');
};
document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); return $('bt-baixar').onclick(); }
  if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); return desfazer(); }
  if (mod && ((k === 'z' && e.shiftKey) || k === 'y')) { e.preventDefault(); return refazer(); }
  if (document.activeElement.matches('textarea, input:not([type=range]):not([type=checkbox]), select')) return;
  if (e.code === 'Space') { e.preventDefault(); tocando ? parar() : tocar(); }
  else if (mod && k === 'b') { e.preventDefault(); dividir(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); apagar(); }
  else if (mod && k === 'a') { e.preventDefault(); selecionarTodos(); }
  else if (!mod && k === 'h') { alternarDesativado(); }
  else if (e.key === 'Escape') { sel = null; multi = []; tudo(); }
  else if (e.key === 'ArrowLeft') { parar(); irPara(T - 1 / FPS); }
  else if (e.key === 'ArrowRight') { parar(); irPara(T + 1 / FPS); }
});

function tudo() { textoAtual = null; desenharTimeline(); props(); sons(); botoesHist(); guardar(); }

// ---------- edição guardada sozinha (10/11: o Zaza salvou a página e a edição se perdeu) ----------
// Guarda no navegador a cada mudança; ao reabrir a mesma página, volta onde parou.
// Ctrl+S baixa o projeto (em vez de salvar a página, que não leva a edição); fechar com edição
// não baixada pede confirmação.
const CHAVE = 'kbeditor:' + (DADOS.projeto.nome || '') + ':' + JSON.stringify(DADOS.projeto).length;
const ORIGINAL = JSON.stringify(DADOS.projeto);
let ultimoBaixado = ORIGINAL;
function guardar() { try { localStorage.setItem(CHAVE, JSON.stringify(P)); } catch (e) { } }
function sujo() { return JSON.stringify(P) !== ultimoBaixado; }
(function recuperar() {
  let salvo = null;
  try { salvo = localStorage.getItem(CHAVE); } catch (e) { }
  if (salvo && salvo !== ORIGINAL) {
    try { pilhaD.push(JSON.stringify(P)); P = JSON.parse(salvo); setTimeout(() => aviso('Voltei na tua edição de antes (Ctrl+Z volta pro original)'), 300); } catch (e) { }
  }
})();
window.addEventListener('beforeunload', (e) => { fecharPendente(); if (sujo()) { e.preventDefault(); e.returnValue = ''; } });
$('titulo').textContent = P.nome ? P.nome.replace(/_/g, ' ') : 'Editor';
requestAnimationFrame(() => { const L = linha(); pxs = Math.min(300, Math.max(20, ($('rolagem').clientWidth - 40) / Math.max(1, L.total))); $('zoom').value = pxs; tudo(); escalar(); requestAnimationFrame(quadro); });
</script>
</body>
